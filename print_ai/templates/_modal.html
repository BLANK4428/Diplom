<!-- ─── Order complete modal ──────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-check">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2>Заказ сформирован</h2>
      <p>Коммерческое предложение готово к передаче в производство</p>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-actions">
      <button id="dl-btn" class="btn-dl">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Скачать ТЗ (DOCX)
      </button>
      <button class="btn-cancel" onclick="closeModal()">Закрыть</button>
    </div>
  </div>
</div>
